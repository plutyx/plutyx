name: gcl-ranking-ci

on:
  push:
    branches: [convrank-hostinger-front]
    paths:
      - 'ranking-conversao/**'
      - '.github/workflows/gcl-ranking-ci.yml'
  pull_request:
    paths:
      - 'ranking-conversao/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ranking-conversao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ranking-conversao/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_BASE_PATH: /ranking-site/
      - name: Verify GCL production surfaces
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          grep -R -F 'Global Conversion League' dist >/dev/null
          grep -R -F 'sac-ranking-site-api' dist/assets/*.js >/dev/null
          grep -R -F 'gcl-member-api' dist/assets/*.js >/dev/null
          grep -R -F 'gcl-moderation-api' dist/assets/*.js >/dev/null
          grep -R -F 'Sua temporada em 5 movimentos' dist/assets/*.js >/dev/null
          grep -R -F 'MEMBER AREA · RECOVERY MODE' dist/assets/*.js >/dev/null
          grep -R -F 'COMMUNITY · STADIUM LOBBY' dist/assets/*.js >/dev/null
          grep -R -F 'PRÓXIMA JOGADA' dist/assets/*.js >/dev/null
          grep -R -F 'OFICIAL · GCL INTELLIGENCE' dist/assets/*.js >/dev/null
          grep -R -F 'Uma denúncia não remove conteúdo automaticamente' dist/assets/*.js >/dev/null
          grep -q '/ranking-site/' dist/index.html
          grep -q 'RewriteBase /ranking-site/' dist/.htaccess
          if grep -R -q 'SUPABASE_SERVICE_ROLE_KEY' dist; then echo 'service role leaked into bundle'; exit 1; fi
      - name: Install browser gates
        run: npx playwright install --with-deps chromium
      - name: Browser gate — member area
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/gcl-preview-member.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ranking-site/account/ >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/ranking-site/account/ >/dev/null || { cat /tmp/gcl-preview-member.log; exit 1; }
          npm run test:member-area
      - name: Browser gate — public surfaces
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/gcl-preview-public.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ranking-site/ >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/ranking-site/ >/dev/null || { cat /tmp/gcl-preview-public.log; exit 1; }
          npm run test:public-surfaces
      - name: Browser gate — reporting and moderation UX
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/gcl-preview-moderation.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ranking-site/community/ >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/ranking-site/community/ >/dev/null || { cat /tmp/gcl-preview-moderation.log; exit 1; }
          npm run test:moderation
      - name: Upload GCL bundle
        uses: actions/upload-artifact@v4
        with:
          name: gcl-ranking-dist-${{ github.sha }}
          path: ranking-conversao/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

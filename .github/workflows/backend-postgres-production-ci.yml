name: backend-postgres-production-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  production-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cozinha360
          POSTGRES_DB: cozinha360
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cozinha360 -d cozinha360"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://cozinha360@localhost:5432/cozinha360
      SECRET_KEY: ci-only-readable-value-not-for-real-production-0123456789abcdef
      CORS_ORIGINS: https://app.cozinha360.example
      PUBLIC_APP_URL: https://app.cozinha360.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply all production migrations to PostgreSQL
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg
          migration_dir = Path('../supabase/migrations')
          files = sorted(migration_dir.glob('*.sql'))
          assert files, 'no migrations found'
          with psycopg.connect('postgresql://cozinha360@localhost:5432/cozinha360') as conn:
              with conn.cursor() as cur:
                  for path in files:
                      print('applying', path.name)
                      cur.execute(path.read_text(encoding='utf-8'))
              conn.commit()
          print(f'{len(files)} migrations applied')
          PY
      - name: Verify schema invariants
        run: |
          python - <<'PY'
          import psycopg
          expected = {
              'users','businesses','memberships','ingredients','products','orders','customers','purchases',
              'audit_logs','outbox_events','order_items','production_batches','recipe_items','team_invites',
              'inventory_counts','order_completion_snapshots','order_recipe_snapshots',
              'user_security_states','auth_action_tokens'
          }
          with psycopg.connect('postgresql://cozinha360@localhost:5432/cozinha360') as conn:
              with conn.cursor() as cur:
                  cur.execute("select table_name from information_schema.tables where table_schema='public'")
                  present = {row[0] for row in cur.fetchall()}
                  missing = expected - present
                  assert not missing, f'missing tables: {sorted(missing)}'
                  cur.execute("select count(*) from pg_indexes where tablename='orders' and indexname='ix_orders_business_status'")
                  assert cur.fetchone()[0] == 1
                  cur.execute("select count(*) from pg_indexes where tablename='order_recipe_snapshots' and indexname='ix_order_recipe_snapshots_order_ingredient'")
                  assert cur.fetchone()[0] == 1
                  cur.execute("select count(*) from pg_indexes where tablename='auth_action_tokens' and indexname='ix_auth_action_tokens_user_purpose_created'")
                  assert cur.fetchone()[0] == 1
                  cur.execute("select count(*) from pg_indexes where tablename='users' and indexname='ux_users_auth_user_id'")
                  assert cur.fetchone()[0] == 1
                  required_columns = [
                      ('ingredients','on_hand_milliunits'),('products','category'),('orders','inventory_consumed'),
                      ('users','auth_version'),('users','failed_login_attempts'),('users','locked_until'),('users','auth_user_id'),
                      ('order_recipe_snapshots','total_qty_milliunits'),
                      ('user_security_states','email_verified_at'),('auth_action_tokens','token_hash')
                  ]
                  for table, column in required_columns:
                      cur.execute("select count(*) from information_schema.columns where table_schema='public' and table_name=%s and column_name=%s", (table,column))
                      assert cur.fetchone()[0] == 1, f'missing {table}.{column}'
                  for fn in ('c360_create_order','c360_set_recipe','c360_complete_order'):
                      cur.execute("select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname=%s", (fn,))
                      assert cur.fetchone()[0] == 1, f'missing function {fn}'
          print('schema invariants ok')
          PY
      - name: Cloud-native transaction smoke
        run: |
          python - <<'PY'
          import json
          import psycopg

          dsn = 'postgresql://cozinha360@localhost:5432/cozinha360'
          with psycopg.connect(dsn, autocommit=False) as conn:
              try:
                  with conn.cursor() as cur:
                      cur.execute("insert into public.users(email,password_hash,full_name) values (%s,%s,%s) returning id", ('ci-cloud-smoke@example.com','ci-smoke','CI Cloud Smoke'))
                      user_id = cur.fetchone()[0]
                      cur.execute("insert into public.businesses(name,city) values (%s,%s) returning id", ('CI Cloud Smoke Kitchen','Mogi das Cruzes'))
                      business_id = cur.fetchone()[0]
                      cur.execute("insert into public.memberships(user_id,business_id,role) values (%s,%s,'owner')", (user_id,business_id))
                      cur.execute("""
                        insert into public.ingredients(
                          business_id,name,unit,last_purchase_price_cents,last_purchase_qty_milliunits,
                          usable_qty_milliunits,on_hand_milliunits,par_level_milliunits,reorder_target_milliunits
                        ) values (%s,'Carne','g',2000,1000,1000,5000,1000,3000) returning id
                      """, (business_id,))
                      ingredient_id = cur.fetchone()[0]
                      cur.execute("""
                        insert into public.products(
                          business_id,name,category,active,units_per_batch,packaging_cents_per_unit,
                          energy_cents_per_batch,labor_cents_per_batch
                        ) values (%s,'Smash CI','hamburguer',true,10,150,500,1000) returning id
                      """, (business_id,))
                      product_id = cur.fetchone()[0]

                      recipe_items = json.dumps([{'ingredient_id': ingredient_id, 'qty_used_milliunits': 1000}])
                      cur.execute("select public.c360_set_recipe(%s,%s,%s::jsonb,%s)", (business_id,product_id,recipe_items,user_id))
                      recipe_result = cur.fetchone()[0]
                      assert recipe_result['items'] == 1

                      order_items = json.dumps([{
                          'product_id': product_id,
                          'quantity': 2,
                          'unit_price_cents': 2500,
                          'unit_variable_cost_cents': 500,
                      }])
                      cur.execute("select public.c360_create_order(%s,%s,%s,%s,%s,%s::jsonb,%s)", (business_id,'ci',False,None,None,order_items,'ci-cloud-smoke-order'))
                      created = cur.fetchone()[0]
                      assert created['total_cents'] == 5000
                      assert created['variable_cost_cents'] == 1000
                      assert created['contribution_cents'] == 4000
                      order_id = int(created['id'])

                      cur.execute("select public.c360_complete_order(%s,%s,%s,%s)", (business_id,order_id,int(created['version']),user_id))
                      completed = cur.fetchone()[0]
                      assert completed['status'] == 'completed'

                      cur.execute("select status,paid,inventory_consumed from public.orders where id=%s", (order_id,))
                      status, paid, consumed = cur.fetchone()
                      assert status == 'completed' and paid is True and consumed is True
                      cur.execute("select on_hand_milliunits from public.ingredients where id=%s", (ingredient_id,))
                      assert cur.fetchone()[0] == 4800
                      cur.execute("select count(*) from public.order_recipe_snapshots where order_id=%s", (order_id,))
                      assert cur.fetchone()[0] == 1
                      cur.execute("select count(*) from public.order_completion_snapshots where order_id=%s", (order_id,))
                      assert cur.fetchone()[0] == 1
                      cur.execute("select count(*) from public.outbox_events where business_id=%s", (business_id,))
                      assert cur.fetchone()[0] >= 2
                      cur.execute("select count(*) from public.audit_logs where business_id=%s", (business_id,))
                      assert cur.fetchone()[0] >= 2
                  print('cloud-native transaction smoke ok')
              finally:
                  conn.rollback()
          PY
      - name: Run production-mode tests against PostgreSQL
        run: python -m pytest -q
      - name: Import application with production guards enabled
        run: python -c "from app.main import app; assert app.title == 'Cozinha 360 OS'; print('production import ok')"

name: render-production-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: render-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WEB_URL: https://cozinha-360-os-v41.onrender.com
      EDGE_ROOT: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1
      GATEWAY: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-gateway-v42
      SETUP_API: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-setup-v42
      INTELLIGENCE_API: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-intelligence-v50
      PURCHASES_API: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-purchases-v53
      SUPPLIERS_API: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-suppliers-v52
      KDS_API: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-kds-v54
      EXPECTED_RELEASE: '5.6.0'
    steps:
      - name: Wait for exact Render release and verify frontend assets
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 75); do
            index_code="$(curl -L -sS -o /tmp/index.html -w '%{http_code}' "$WEB_URL/?check=$GITHUB_RUN_ID-$i")" || index_code=000
            release_code="$(curl -L -sS -o /tmp/release.json -w '%{http_code}' "$WEB_URL/release.json?check=$GITHUB_RUN_ID-$i")" || release_code=000
            marker="<meta name=\"c360-release\" content=\"$EXPECTED_RELEASE\""
            if [ "$index_code" = "200" ] \
              && [ "$release_code" = "200" ] \
              && grep -F "$marker" /tmp/index.html >/dev/null \
              && jq -e --arg release "$EXPECTED_RELEASE" --arg sha "$GITHUB_SHA" '.release == $release and .commit == $sha' /tmp/release.json >/dev/null; then
              ready=1
              break
            fi
            sleep 4
          done
          test "$ready" = "1"

          js_asset="$(grep -Eo '/assets/[^\" ]+\.js' /tmp/index.html | head -n1)"
          css_asset="$(grep -Eo '/assets/[^\" ]+\.css' /tmp/index.html | head -n1 || true)"
          test -n "$js_asset"
          test "$(curl -L -sS -o /tmp/entry.js -w '%{http_code}' "$WEB_URL$js_asset")" = "200"
          test -s /tmp/entry.js
          if [ -n "$css_asset" ]; then
            test "$(curl -L -sS -o /tmp/app.css -w '%{http_code}' "$WEB_URL$css_asset")" = "200"
            test -s /tmp/app.css
          fi

      - name: Verify Render origin is accepted by production Edge services
        shell: bash
        run: |
          set -euo pipefail
          targets=("$GATEWAY" "$EDGE_ROOT/cozinha360-api-v2" "$EDGE_ROOT/cozinha360-integrations-v29" "$EDGE_ROOT/cozinha360-profile-v31" "$EDGE_ROOT/cozinha360-entitlements-v34" "$EDGE_ROOT/cozinha360-autopilot-v37" "$SETUP_API" "$INTELLIGENCE_API" "$PURCHASES_API" "$SUPPLIERS_API" "$KDS_API")
          failed=0
          for target in "${targets[@]}"; do
            key="$(echo "$target" | tr '/:' '__')";headers="/tmp/${key}.headers"
            code="$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: $WEB_URL" -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: authorization,content-type' "$target")" || code=000
            origin="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/{gsub("\r",""); sub(/^[^:]+:[ ]*/,""); print; exit}' "$headers" 2>/dev/null || true)"
            echo "$target status=$code allow-origin=${origin:-missing}"
            if [ "$code" != "204" ] && [ "$code" != "200" ]; then failed=1; fi
            if [ "$origin" != "*" ] && [ "$origin" != "$WEB_URL" ]; then failed=1; fi
          done
          test "$failed" = "0"

      - name: Verify production service health and auth boundaries
        shell: bash
        run: |
          set -euo pipefail
          check_json() {
            local label="$1" url="$2" expected_code="$3" expected_text="$4" file="$5"
            local code
            code="$(curl -sS -o "$file" -w '%{http_code}' "$url")" || code=000
            echo "[$label] status=$code body=$(cat "$file" 2>/dev/null || true)"
            if [ "$code" != "$expected_code" ]; then
              echo "::error title=$label status mismatch::Expected HTTP $expected_code, got $code from $url"
              return 1
            fi
            if [ -n "$expected_text" ] && ! grep -F "$expected_text" "$file" >/dev/null; then
              echo "::error title=$label body mismatch::Expected body marker $expected_text from $url"
              return 1
            fi
          }

          check_json 'gateway health' "$GATEWAY/health" 200 '"status":"ok"' /tmp/gateway-health.json
          check_json 'delivery health' "$GATEWAY/cozinha360-delivery-v40/health" 200 '' /tmp/delivery-health.json
          check_json 'intelligence health' "$INTELLIGENCE_API/health" 200 '' /tmp/intelligence-health.json
          check_json 'purchases live' "$PURCHASES_API/livez" 200 '"version":"5.3.0"' /tmp/purchases-live.json
          check_json 'suppliers live' "$SUPPLIERS_API/livez" 200 '' /tmp/suppliers-live.json
          check_json 'kds live' "$KDS_API/livez" 200 '"version":"5.4.0"' /tmp/kds-live.json
          check_json 'kds ready' "$KDS_API/readyz" 200 '"sla_columns":"ready"' /tmp/kds-ready.json
          check_json 'intelligence unauth' "$INTELLIGENCE_API/portfolio/overview" 401 'Sessão inválida' /tmp/intelligence-auth.json
          check_json 'purchases unauth' "$PURCHASES_API/businesses/1/purchase-plan?history_days=28&cover_days=7" 401 'Sessão inválida' /tmp/purchases-auth.json
          check_json 'suppliers unauth' "$SUPPLIERS_API/businesses/1/suppliers" 401 'Sessão inválida' /tmp/suppliers-auth.json
          check_json 'kds unauth' "$KDS_API/businesses/1/kds" 401 'Sessão inválida' /tmp/kds-auth.json
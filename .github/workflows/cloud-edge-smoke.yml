name: cloud-edge-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/cloud-edge-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/cloud-edge-smoke.yml'

jobs:
  public-edge-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EDGE_BASE: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-api-v2
      PROFILE_EDGE: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-profile-v31
      ENTITLEMENTS_EDGE: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-entitlements-v34
      AUTOPILOT_EDGE: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-autopilot-v37
    steps:
      - name: Liveness
        run: |
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$EDGE_BASE/livez")"
          python -c 'import json,sys; x=json.loads(sys.argv[1]); assert x["ok"] is True and x["service"]=="cozinha360-edge"' "$body"
      - name: Readiness includes persistent database
        run: |
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$EDGE_BASE/readyz")"
          python -c 'import json,sys; x=json.loads(sys.argv[1]); assert x["ok"] is True and x["database"]=="ready"' "$body"
      - name: Auth endpoint rejects invalid payload safely
        run: |
          status="$(curl --silent --output /tmp/auth.json --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{}' "$EDGE_BASE/auth/signup")"
          test "$status" = "422"
          python -c 'import json; x=json.load(open("/tmp/auth.json")); assert "detail" in x'
      - name: Smart setup service is live
        run: |
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$PROFILE_EDGE/livez")"
          python -c 'import json,sys; x=json.loads(sys.argv[1]); assert x["ok"] is True and x["service"]=="cozinha360-profile-v31" and x["version"]=="3.1.0"' "$body"
      - name: Smart setup database is ready
        run: |
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$PROFILE_EDGE/readyz")"
          python -c 'import json,sys; x=json.loads(sys.argv[1]); assert x["ok"] is True and x["database"]=="ready"' "$body"
      - name: Smart setup tenant route requires auth
        run: |
          status="$(curl --silent --output /tmp/profile-auth.json --write-out '%{http_code}' "$PROFILE_EDGE/businesses/1/profile")"
          test "$status" = "401"
          python -c 'import json; x=json.load(open("/tmp/profile-auth.json")); assert x.get("detail")=="Sessão inválida"'
      - name: Entitlement service is live
        run: |
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$ENTITLEMENTS_EDGE/livez")"
          python -c 'import json,sys; x=json.loads(sys.argv[1]); assert x["ok"] is True and x["service"]=="cozinha360-entitlements-v34" and x["version"]=="3.4.0"' "$body"
      - name: Entitlement database and event ledger are ready
        run: |
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$ENTITLEMENTS_EDGE/readyz")"
          python -c 'import json,sys; x=json.loads(sys.argv[1]); assert x["ok"] is True and x["database"]=="ready" and x["event_ledger"]=="ready"' "$body"
      - name: Entitlement tenant route requires auth
        run: |
          status="$(curl --silent --output /tmp/entitlements-auth.json --write-out '%{http_code}' "$ENTITLEMENTS_EDGE/businesses/1/entitlements")"
          test "$status" = "401"
          python -c 'import json; x=json.load(open("/tmp/entitlements-auth.json")); assert x.get("detail")=="Sessão inválida"'
      - name: Autopilot service is live
        run: |
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$AUTOPILOT_EDGE/livez")"
          python -c 'import json,sys; x=json.loads(sys.argv[1]); assert x["ok"] is True and x["service"]=="cozinha360-autopilot-v37" and x["version"]=="3.7.0"' "$body"
      - name: Autopilot ledger and core dependency are ready
        run: |
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$AUTOPILOT_EDGE/readyz")"
          python -c 'import json,sys; x=json.loads(sys.argv[1]); assert x["ok"] is True and x["database"]=="ready" and x["core"]=="ready" and x["version"]=="3.7.0"' "$body"
      - name: Autopilot tenant plan requires auth
        run: |
          status="$(curl --silent --output /tmp/autopilot-auth.json --write-out '%{http_code}' "$AUTOPILOT_EDGE/businesses/1/plan")"
          test "$status" = "401"
          python -c 'import json; x=json.load(open("/tmp/autopilot-auth.json")); assert x.get("detail")=="Sessão inválida"'

name: browser-e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  customer-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend and browser runner
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start API and web app
        run: |
          (
            cd backend
            export PYTHONPATH=.
            export DATABASE_URL=sqlite:///./browser-e2e.db
            export SECRET_KEY=browser-e2e-secret-key
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/cozinha360-api.log 2>&1 &
            echo $! > /tmp/cozinha360-api.pid
          )
          (
            cd frontend
            npm run dev -- --host 127.0.0.1 > /tmp/cozinha360-web.log 2>&1 &
            echo $! > /tmp/cozinha360-web.pid
          )
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null && curl -fsS http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'services did not become ready'
          cat /tmp/cozinha360-api.log || true
          cat /tmp/cozinha360-web.log || true
          exit 1

      - name: Run browser customer journey
        run: node frontend/e2e/smoke.mjs

      - name: Run operating-memory journey
        run: node frontend/e2e/operating-memory.mjs

      - name: Run kitchen-intelligence journey
        run: node frontend/e2e/kitchen-intelligence.mjs

      - name: Run cash-engine journey
        run: node frontend/e2e/cash-engine.mjs

      - name: Run connections-hub journey
        run: node frontend/e2e/connections-hub.mjs

      - name: Run entitlement journey
        run: node frontend/e2e/entitlements.mjs

      - name: Run Autopilot 360 journey
        run: node frontend/e2e/autopilot-360.mjs

      - name: Upload E2E evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          if-no-files-found: ignore
          path: |
            /tmp/cozinha360-e2e-success.png
            /tmp/cozinha360-e2e-failure.png
            /tmp/cozinha360-inventory-drawer.png
            /tmp/cozinha360-kitchen-batch.png
            /tmp/cozinha360-kitchen-components.png
            /tmp/cozinha360-kitchen-components-failure.png
            /tmp/cozinha360-system360.png
            /tmp/cozinha360-operating-memory.png
            /tmp/cozinha360-operating-memory-failure.png
            /tmp/cozinha360-cash-engine.png
            /tmp/cozinha360-cash-engine-failure.png
            /tmp/cozinha360-connections-hub.png
            /tmp/cozinha360-connections-hub-failure.png
            /tmp/cozinha360-entitlements.png
            /tmp/cozinha360-entitlements-failure.png
            /tmp/cozinha360-autopilot-360.png
            /tmp/cozinha360-autopilot-360-failure.png
            /tmp/cozinha360-api.log
            /tmp/cozinha360-web.log

name: one-time-v421-route-ui

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v421-route-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden route provider selection
        shell: python
        run: |
          from pathlib import Path

          p = Path('frontend/src/integration-setup-v42.tsx')
          s = p.read_text()

          old = " const mapReady=useMemo(()=>data?.providers.some(p=>['maps_google','mapbox'].includes(p.key)&&p.state==='active')||false,[data])"
          new = " const routeProviders=useMemo(()=>{const out:string[]=[];if(data?.providers.some(p=>p.key==='maps_google'&&p.state==='active'))out.push('google');if(data?.providers.some(p=>p.key==='mapbox'&&p.state==='active'))out.push('mapbox');return out},[data])\n const mapReady=routeProviders.length>0"
          if old not in s:
              raise SystemExit('mapReady anchor not found')
          s = s.replace(old, new, 1)

          old = "<button disabled={!mapReady} className={routeMode==='assisted'?'active':''} onClick={()=>setRouteMode('assisted')}><MapPinned/><b>Assistida</b><span>ETA/distância com provider</span></button><button disabled={!mapReady} className={routeMode==='intelligent'?'active':''} onClick={()=>setRouteMode('intelligent')}><Sparkles/><b>Inteligente</b><span>otimização com provider validado</span></button>"
          new = "<button disabled={!mapReady} className={routeMode==='assisted'?'active':''} onClick={()=>{setRouteMode('assisted');if(!routeProviders.includes(routeProvider))setRouteProvider(routeProviders[0]||'manual')}}><MapPinned/><b>Assistida</b><span>ETA/distância com provider</span></button><button disabled={!mapReady} className={routeMode==='intelligent'?'active':''} onClick={()=>{setRouteMode('intelligent');if(!routeProviders.includes(routeProvider))setRouteProvider(routeProviders[0]||'manual')}}><Sparkles/><b>Inteligente</b><span>otimização com provider validado</span></button>"
          if old not in s:
              raise SystemExit('route mode buttons anchor not found')
          s = s.replace(old, new, 1)

          old = "<option value=\"\">Escolher</option><option value=\"google\">Google Maps Routes</option><option value=\"mapbox\">Mapbox</option><option value=\"external\">Outro provedor homologado</option>"
          new = "<option value=\"\">Escolher</option>{routeProviders.includes('google')&&<option value=\"google\">Google Maps Routes</option>}{routeProviders.includes('mapbox')&&<option value=\"mapbox\">Mapbox</option>}"
          if old not in s:
              raise SystemExit('route provider options anchor not found')
          s = s.replace(old, new, 1)

          old = "disabled={Boolean(busy)||routeMode!=='manual'&&!routeProvider} onClick={()=>void saveRoute()}"
          new = "disabled={Boolean(busy)||routeMode!=='manual'&&!routeProviders.includes(routeProvider)} onClick={()=>void saveRoute()}"
          if old not in s:
              raise SystemExit('route save guard anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Commit route UI hardening
        run: |
          git config user.name 'cozinha360-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/integration-setup-v42.tsx
          git commit -m 'Only offer validated route providers in Setup 360'
          git push origin HEAD:main

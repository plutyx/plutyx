name: gcl-load-smoke

on:
  workflow_dispatch:
    inputs:
      read_requests:
        description: Public API read requests
        required: false
        default: '100'
      read_concurrency:
        description: Public API read concurrency
        required: false
        default: '12'
      qualify_requests:
        description: URL qualify requests (no full scan)
        required: false
        default: '12'
      qualify_concurrency:
        description: URL qualify concurrency
        required: false
        default: '4'
      hostinger_requests:
        description: Hostinger route requests
        required: false
        default: '48'
      hostinger_concurrency:
        description: Hostinger route concurrency
        required: false
        default: '8'
  push:
    branches: [convrank-hostinger-front]
    paths:
      - 'ranking-conversao/scripts/load-smoke.mjs'
      - '.github/workflows/gcl-load-smoke.yml'

jobs:
  production-load-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ranking-conversao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlled public production load smoke
        env:
          GCL_LOAD_READ_REQUESTS: ${{ inputs.read_requests || '100' }}
          GCL_LOAD_READ_CONCURRENCY: ${{ inputs.read_concurrency || '12' }}
          GCL_LOAD_QUALIFY_REQUESTS: ${{ inputs.qualify_requests || '12' }}
          GCL_LOAD_QUALIFY_CONCURRENCY: ${{ inputs.qualify_concurrency || '4' }}
          GCL_LOAD_HOSTINGER_REQUESTS: ${{ inputs.hostinger_requests || '48' }}
          GCL_LOAD_HOSTINGER_CONCURRENCY: ${{ inputs.hostinger_concurrency || '8' }}
          GCL_PUBLIC_API: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/sac-ranking-site-api
          GCL_PROD_BASE: https://plutyx.com/ranking-site
        run: node scripts/load-smoke.mjs
      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcl-load-smoke-${{ github.run_id }}
          path: ranking-conversao/load-smoke-result.json
          if-no-files-found: warn
          retention-days: 30

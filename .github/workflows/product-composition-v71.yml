name: product-composition-v71

on:
  push:
    branches: [main]
  pull_request:

jobs:
  product-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: python -m pip install -r backend/requirements.txt

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start API and web app
        run: |
          (
            cd backend
            export PYTHONPATH=.
            export DATABASE_URL=sqlite:///./product-composition-v71.db
            export SECRET_KEY=product-composition-v71-secret
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/cozinha360-product-v71-api.log 2>&1 &
            echo $! > /tmp/cozinha360-product-v71-api.pid
          )
          (
            cd frontend
            npm run dev -- --host 127.0.0.1 > /tmp/cozinha360-product-v71-web.log 2>&1 &
            echo $! > /tmp/cozinha360-product-v71-web.pid
          )
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null && curl -fsS http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'services did not become ready'
          cat /tmp/cozinha360-product-v71-api.log || true
          cat /tmp/cozinha360-product-v71-web.log || true
          exit 1

      - name: Run product composition v7.1 journey
        run: node frontend/e2e/product-composition-v71.mjs

      - name: Upload v7.1 evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-composition-v71-evidence
          if-no-files-found: ignore
          path: |
            /tmp/cozinha360-product-composition-v71.png
            /tmp/cozinha360-product-composition-v71-mobile.png
            /tmp/cozinha360-product-composition-v71-failure.png
            /tmp/cozinha360-product-v71-api.log
            /tmp/cozinha360-product-v71-web.log

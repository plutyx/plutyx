name: one-time-v423-account-picker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v423-account-picker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make account selection explicit when one provider has multiple accounts
        shell: python
        run: |
          from pathlib import Path

          p=Path('frontend/src/integration-setup-v42.tsx')
          s=p.read_text()

          old=" const bindable=useMemo(()=>activeConnections.filter(c=>['ifood','whatsapp','mercadopago'].includes(c.provider)),[activeConnections])\n"
          new=old+" const bindableProviders=useMemo(()=>[...new Set(bindable.map(c=>c.provider))],[bindable])\n"
          if old not in s: raise SystemExit('bindable anchor not found')
          s=s.replace(old,new,1)

          old=" async function toggleBinding(brand:Brand,connection:Connection){const existing=data?.bindings.find(b=>b.brand_id===brand.id&&b.provider===connection.provider&&b.active);if(existing){await mutate(`bindings/${existing.id}`,'DELETE',null,`${providerLabel[connection.provider]||connection.provider} removido de ${brand.name}.`);return}await mutate('bindings','POST',{brand_id:brand.id,connection_id:connection.id,provider:connection.provider,order_import_enabled:['ifood','whatsapp'].includes(connection.provider),auto_accept_orders:false},`${providerLabel[connection.provider]||connection.provider} ligado à marca ${brand.name}.`)}\n"
          new=" async function setBinding(brand:Brand,connection:Connection){const label=providerLabel[connection.provider]||connection.provider,account=connection.display_name||`${label} #${connection.id}`;await mutate('bindings','POST',{brand_id:brand.id,connection_id:connection.id,provider:connection.provider,order_import_enabled:['ifood','whatsapp'].includes(connection.provider),auto_accept_orders:false},`${label} · ${account} ligado à marca ${brand.name}.`)}\n async function removeBinding(brand:Brand,provider:string){const existing=data?.bindings.find(b=>b.brand_id===brand.id&&b.provider===provider&&b.active);if(existing)await mutate(`bindings/${existing.id}`,'DELETE',null,`${providerLabel[provider]||provider} removido de ${brand.name}.`)}\n async function toggleBinding(brand:Brand,connection:Connection){const existing=data?.bindings.find(b=>b.brand_id===brand.id&&b.provider===connection.provider&&b.active);if(existing?.connection_id===connection.id){await removeBinding(brand,connection.provider);return}await setBinding(brand,connection)}\n async function chooseBinding(brand:Brand,provider:string,connectionId:number){if(!connectionId){await removeBinding(brand,provider);return}const connection=bindable.find(c=>c.id===connectionId&&c.provider===provider);if(!connection){setError('A conta selecionada não está mais ativa. Atualize a página e tente novamente.');return}await setBinding(brand,connection)}\n"
          if old not in s: raise SystemExit('toggleBinding anchor not found')
          s=s.replace(old,new,1)

          old="<div className=\"setup42-chips\">{bindable.length?bindable.map(c=>{const active=Boolean(data.bindings.find(b=>b.brand_id===brand.id&&b.provider===c.provider&&b.active));return <button key={c.id} disabled={Boolean(busy)} className={active?'active':''} onClick={()=>void toggleBinding(brand,c)}>{active?<Check size={14}/>:<Link2 size={14}/>} {providerLabel[c.provider]||c.provider}</button>}):<span className=\"setup42-muted\">Conecte iFood, WhatsApp ou Mercado Pago para distribuir contas entre marcas.</span>}</div>"
          new="<div className=\"setup42-chips\">{bindableProviders.length?bindableProviders.map(provider=>{const options=bindable.filter(c=>c.provider===provider),current=data.bindings.find(b=>b.brand_id===brand.id&&b.provider===provider&&b.active),label=providerLabel[provider]||provider;if(options.length===1){const c=options[0],active=current?.connection_id===c.id;return <button key={provider} disabled={Boolean(busy)} className={active?'active':''} title={c.display_name||label} onClick={()=>void toggleBinding(brand,c)}>{active?<Check size={14}/>:<Link2 size={14}/>} {label}{c.display_name&&<small>{c.display_name}</small>}</button>}return <label className=\"setup42-account-picker\" key={provider}><span>{label}<em>{options.length} contas</em></span><select aria-label={`${label} · ${brand.name}`} disabled={Boolean(busy)} value={current?.connection_id||''} onChange={e=>void chooseBinding(brand,provider,Number(e.target.value))}><option value=\"\">Escolha a conta</option>{options.map(c=><option key={c.id} value={c.id}>{c.display_name||`${label} #${c.id}`}</option>)}</select><small>{current?'Conta vinculada explicitamente a esta marca.':'Selecione a conta correta; o 360 não escolhe por você.'}</small></label>}):<span className=\"setup42-muted\">Conecte iFood, WhatsApp ou Mercado Pago para distribuir contas entre marcas.</span>}</div>"
          if old not in s: raise SystemExit('brand chips anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          css=Path('frontend/src/integration-setup-v42.css')
          c=css.read_text()
          anchor=".setup42-chips button.active{border-color:#55705a;background:#172118;color:#bfe1c6}"
          add=anchor+".setup42-chips button small{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#83776f;font-size:8px}.setup42-chips button.active small{color:#91b99a}.setup42-account-picker{min-width:240px;display:grid;gap:5px;border:1px solid #3b302a;background:#120f0d;border-radius:13px;padding:9px 10px}.setup42-account-picker>span{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#c9baad;font-size:10px;font-weight:800}.setup42-account-picker em{font-style:normal;font-size:8px;color:#cda65a;background:#241c16;border-radius:999px;padding:3px 6px}.setup42-account-picker select{padding:7px 8px;border-radius:8px;font-size:10px}.setup42-account-picker>small{font-size:8px;line-height:1.35;color:#756b65}"
          if anchor not in c: raise SystemExit('css chips anchor not found')
          c=c.replace(anchor,add,1)
          css.write_text(c)

      - name: Extend Setup 360 browser test with duplicate provider accounts
        shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/e2e/integration-setup-v42.mjs')
          s=p.read_text()
          old=" {id:12,provider:'mercadopago',display_name:'Mercado Pago Operação',status:'active',last_success_at:'2026-09-06T12:00:00Z',last_error:null}\n]"
          new=" {id:12,provider:'mercadopago',display_name:'Mercado Pago Operação',status:'active',last_success_at:'2026-09-06T12:00:00Z',last_error:null},\n {id:13,provider:'ifood',display_name:'Loja iFood Shopping',status:'active',last_success_at:'2026-09-06T12:00:00Z',last_error:null}\n]"
          if old not in s: raise SystemExit('connections anchor not found')
          s=s.replace(old,new,1)

          old=" const burger=page.locator('.setup42-brand-matrix article').filter({hasText:'Bolso Burgers'})\n const ifoodChip=burger.getByRole('button',{name:/iFood/})\n await ifoodChip.click()\n await page.getByText('iFood ligado à marca Bolso Burgers.',{exact:true}).waitFor()\n if(bindings.length!==1||bindings[0].brand_id!==1||bindings[0].provider!=='ifood')throw new Error(`explicit brand mapping failed ${JSON.stringify(bindings)}`)\n await ifoodChip.click()\n await page.getByText('iFood removido de Bolso Burgers.',{exact:true}).waitFor()\n if(bindings.length!==0)throw new Error('explicit unlink did not remove mapping')\n await ifoodChip.click()\n await page.getByText('iFood ligado à marca Bolso Burgers.',{exact:true}).waitFor()\n"
          new=" const burger=page.locator('.setup42-brand-matrix article').filter({hasText:'Bolso Burgers'})\n const ifoodPicker=burger.getByLabel('iFood · Bolso Burgers')\n await ifoodPicker.waitFor()\n if(await ifoodPicker.locator('option').count()!==3)throw new Error('iFood picker must offer placeholder plus both active accounts')\n await ifoodPicker.selectOption('13')\n await page.getByText('iFood · Loja iFood Shopping ligado à marca Bolso Burgers.',{exact:true}).waitFor()\n if(bindings.length!==1||bindings[0].brand_id!==1||bindings[0].provider!=='ifood'||bindings[0].connection_id!==13)throw new Error(`explicit account mapping failed ${JSON.stringify(bindings)}`)\n await ifoodPicker.selectOption('10')\n await page.getByText('iFood · Loja iFood Centro ligado à marca Bolso Burgers.',{exact:true}).waitFor()\n if(bindings.length!==1||bindings[0].connection_id!==10)throw new Error(`provider account switch created ambiguity ${JSON.stringify(bindings)}`)\n await ifoodPicker.selectOption('')\n await page.getByText('iFood removido de Bolso Burgers.',{exact:true}).waitFor()\n if(bindings.length!==0)throw new Error('explicit unlink did not remove mapping')\n await ifoodPicker.selectOption('10')\n await page.getByText('iFood · Loja iFood Centro ligado à marca Bolso Burgers.',{exact:true}).waitFor()\n"
          if old not in s: raise SystemExit('iFood chip test anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

      - name: Commit explicit account picker
        run: |
          git config user.name 'cozinha360-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/integration-setup-v42.tsx frontend/src/integration-setup-v42.css frontend/e2e/integration-setup-v42.mjs
          git commit -m 'Require explicit provider account selection in Setup 360'
          git push origin HEAD:main

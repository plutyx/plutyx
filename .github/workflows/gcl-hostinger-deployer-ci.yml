name: gcl-hostinger-deployer-ci

on:
  pull_request:
    paths:
      - 'hostinger-deployer/**'
      - '.github/workflows/gcl-hostinger-deployer-ci.yml'
      - '.github/workflows/gcl-production-proof.yml'
  push:
    branches: [convrank-hostinger-front]
    paths:
      - 'hostinger-deployer/**'
      - '.github/workflows/gcl-hostinger-deployer-ci.yml'
      - '.github/workflows/gcl-production-proof.yml'

jobs:
  deployer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployer syntax
        run: |
          node --check hostinger-deployer/start.mjs
          node --check hostinger-deployer/deploy.mjs
          node --check hostinger-deployer/secrets.mjs
          node --check hostinger-deployer/deployment-strategy.mjs
          node --check hostinger-deployer/ci-run.mjs
          node --check hostinger-deployer/autosync-policy.mjs
          node --check hostinger-deployer/autosync.mjs
          test ! -f hostinger-deployer/control-plane.mjs || node --check hostinger-deployer/control-plane.mjs
      - name: Deployment strategy tests
        run: node --test hostinger-deployer/deployment-strategy.test.mjs
      - name: Autonomous release sync policy tests
        run: node --test hostinger-deployer/autosync-policy.test.mjs
      - name: Wake-driven control-plane tests
        run: node --test hostinger-deployer/control-plane.test.mjs
      - name: Production proof re-wake policy tests
        run: node --test hostinger-deployer/proof-rewake-policy.test.mjs

name: ConvRank SAC Worker

on:
  push:
    branches:
      - convrank-sac-worker-v2
    paths:
      - 'convrank_worker/**'
      - '.github/workflows/convrank-sac-worker.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r convrank_worker/requirements.txt pytest pytest-asyncio
      - run: python -m py_compile convrank_worker/app.py
      - run: pytest -q convrank_worker/test_app.py

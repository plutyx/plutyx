name: ConvRank SAC Worker

on:
  push:
    branches:
      - convrank-sac-worker-v2
    paths:
      - 'convrank_worker/**'
      - '.github/workflows/convrank-sac-worker.yml'
  pull_request:
    branches:
      - convrank-sac-worker-v2
    paths:
      - 'convrank_worker/**'
      - '.github/workflows/convrank-sac-worker.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: convrank_worker/package.json
      - run: pip install -r convrank_worker/requirements.txt pytest pytest-asyncio
      - run: npm install --prefix convrank_worker --no-audit --no-fund
      - run: convrank_worker/node_modules/.bin/lighthouse --version
      - run: python -m py_compile convrank_worker/app.py convrank_worker/fallback_sources.py convrank_worker/axe_app.py convrank_worker/lighthouse_app.py convrank_worker/render_isolation.py convrank_worker/render_subprocess.py convrank_worker/chrome_path_subprocess.py convrank_worker/runtime_telemetry.py convrank_worker/hardened_lighthouse.py
      - run: pytest -q convrank_worker/test_app.py convrank_worker/test_fallback_sources.py convrank_worker/test_axe_app.py convrank_worker/test_lighthouse_cleanup.py convrank_worker/test_lighthouse_deadline.py convrank_worker/test_axe_cleanup.py convrank_worker/test_render_isolation.py convrank_worker/test_runtime_telemetry.py convrank_worker/test_hardened_lighthouse.py

name: netlify-production-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETLIFY_SITE_ID: 90508832-a343-4223-98d5-9f7ac45adc79
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      PUBLIC_URL: https://cozinha-360-os.netlify.app
      VITE_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-api-v2
      VITE_MARGIN_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-gateway-v42/cozinha360-margin-v14
      VITE_CRM_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-gateway-v42/cozinha360-crm-v16
      VITE_DIRECT_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-gateway-v42/cozinha360-direct-v17
      VITE_INTEGRATIONS_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-integrations-v29
      VITE_PROFILE_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-profile-v31
      VITE_ENTITLEMENTS_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-entitlements-v34
      VITE_AUTOPILOT_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-autopilot-v37
      VITE_DELIVERY_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-gateway-v42/cozinha360-delivery-v40
      VITE_SETUP_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-setup-v42
      VITE_INTELLIGENCE_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-intelligence-v50
      VITE_PURCHASES_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-purchases-v53
      VITE_SUPPLIERS_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-suppliers-v52
      VITE_KDS_API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-kds-v54
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Netlify production credential
        shell: bash
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error title=Netlify production credential missing::Configure NETLIFY_AUTH_TOKEN in GitHub Actions secrets."
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build exact production bundle
        working-directory: frontend
        run: npm run build

      - name: Read release identity from bundle
        id: release
        working-directory: frontend
        shell: bash
        run: |
          release="$(jq -r '.release' dist/release.json)"
          commit="$(jq -r '.commit' dist/release.json)"
          test -n "$release"
          test "$commit" = "$GITHUB_SHA"
          echo "value=$release" >> "$GITHUB_OUTPUT"

      - name: Verify production Edge endpoints are bundled
        working-directory: frontend
        run: |
          grep -R -F 'cozinha360-gateway-v42' dist/assets/*.js >/dev/null
          grep -R -F 'cozinha360-delivery-v40' dist/assets/*.js >/dev/null
          grep -R -F 'cozinha360-purchases-v53' dist/assets/*.js >/dev/null
          grep -R -F 'cozinha360-suppliers-v52' dist/assets/*.js >/dev/null
          grep -R -F 'cozinha360-kds-v54' dist/assets/*.js >/dev/null
          grep -R -F 'PREVISÃO OPERACIONAL' dist/assets/*.js >/dev/null
          grep -R -F 'SLAs da operação' dist/assets/*.js >/dev/null

      - name: Deploy exact bundle to canonical Netlify production
        working-directory: frontend
        run: |
          npx --yes netlify-cli@27.5.0 deploy --dir=dist --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Cozinha 360 production ${{ steps.release.outputs.value }} · $GITHUB_SHA" --json > /tmp/netlify-deploy.json
          node -e "const x=require('/tmp/netlify-deploy.json'); if(!x.deploy_url && !x.deployUrl && !x.url) process.exit(1); console.log('Netlify deploy accepted:', x.deploy_url||x.deployUrl||x.url)"

      - name: Verify canonical alias serves this exact SHA
        shell: bash
        run: |
          marker="<meta name=\"c360-release\" content=\"${{ steps.release.outputs.value }}\""
          ready=0
          for i in $(seq 1 45); do
            index_code="$(curl --silent --show-error --location -H 'Cache-Control: no-cache' --output /tmp/public-index.html --write-out '%{http_code}' "$PUBLIC_URL/?check=$GITHUB_RUN_ID-$i")" || true
            release_code="$(curl --silent --show-error --location -H 'Cache-Control: no-cache' --output /tmp/public-release.json --write-out '%{http_code}' "$PUBLIC_URL/release.json?check=$GITHUB_RUN_ID-$i")" || true
            if [ "$index_code" = "200" ] && [ "$release_code" = "200" ] \
              && grep -F "$marker" /tmp/public-index.html >/dev/null \
              && jq -e --arg release "${{ steps.release.outputs.value }}" --arg sha "$GITHUB_SHA" '.release == $release and .commit == $sha' /tmp/public-release.json >/dev/null \
              && grep -E '/assets/[^" ]+\.js' /tmp/public-index.html >/dev/null; then
              ready=1
              break
            fi
            sleep 4
          done
          test "$ready" = "1"
          echo "Canonical Netlify production serves ${{ steps.release.outputs.value }} · $GITHUB_SHA"

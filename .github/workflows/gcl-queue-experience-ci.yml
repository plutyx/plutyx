name: gcl-queue-experience-ci

on:
  pull_request:
    paths:
      - 'ranking-conversao/**'
      - '.github/workflows/gcl-queue-experience-ci.yml'
  push:
    branches: [convrank-hostinger-front]
    paths:
      - 'ranking-conversao/**'
      - '.github/workflows/gcl-queue-experience-ci.yml'

jobs:
  queue-browser-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ranking-conversao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ranking-conversao/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_BASE_PATH: /ranking-site/
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Queue position + ETA browser contract
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/gcl-preview-queue.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ranking-site/ >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/ranking-site/ >/dev/null || { cat /tmp/gcl-preview-queue.log; exit 1; }
          npm run test:queue-experience

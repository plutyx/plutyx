name: public-web-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  public-web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WEB_URL: https://cozinha-360-os-v41.onrender.com
      API_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-api-v2
      GATEWAY_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-gateway-v42
      SETUP_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-setup-v42
      INTELLIGENCE_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-intelligence-v50
      PURCHASES_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-purchases-v53
      SUPPLIERS_URL: https://npgheuzpnkwtxopswpqy.supabase.co/functions/v1/cozinha360-suppliers-v52
      EXPECTED_RELEASE: '5.3.0'
    steps:
      - name: Public frontend serves current v5.3 release
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          for i in $(seq 1 75); do
            code="$(curl --silent --show-error --location --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$WEB_URL?check=$GITHUB_RUN_ID-$i")" || true
            marker="<meta name=\"c360-release\" content=\"$EXPECTED_RELEASE\""
            if [ "$code" = "200" ] && grep -Fq "$marker" "$body"; then break; fi
            sleep 4
          done
          marker="<meta name=\"c360-release\" content=\"$EXPECTED_RELEASE\""
          grep -Fq "$marker" "$body"
          grep -Eiq '^content-type: *text/html' "$headers"
          grep -Fq 'Cozinha 360 OS' "$body"
          asset="$(grep -Eo 'src="/assets/index-[^"]+\.js"' "$body" | head -1 | cut -d'"' -f2)"
          test -n "$asset"
          bundle="$(mktemp)"
          test "$(curl --fail-with-body --silent --show-error --output "$bundle" --write-out '%{http_code}' "$WEB_URL$asset")" = "200"
          grep -Fq 'cozinha360-api-v2' "$bundle"
          grep -Fq 'cozinha360-gateway-v42' "$bundle"
          grep -Fq 'cozinha360-delivery-v40' "$bundle"
          grep -Fq 'cozinha360-setup-v42' "$bundle"
          grep -Fq 'cozinha360-intelligence-v50' "$bundle"
          grep -Fq 'cozinha360-purchases-v53' "$bundle"
          grep -Fq 'cozinha360-suppliers-v52' "$bundle"
          grep -Fq 'Conte o estoque. O 360 explica a diferença.' "$bundle"
          grep -Fq 'Compre pelo alvo. Não pelo susto.' "$bundle"
          grep -Fq 'PREVISÃO OPERACIONAL' "$bundle"
          grep -Fq 'Saiba com quem comprar antes de faltar.' "$bundle"
          grep -Fq 'Configuração inteligente' "$bundle"
          echo 'public frontend v5.3 smoke ok'

      - name: Public cloud API liveness and readiness
        run: |
          set -euo pipefail
          test "$(curl --fail-with-body --silent --show-error --output /tmp/livez.json --write-out '%{http_code}' "$API_URL/livez")" = "200"
          test "$(curl --fail-with-body --silent --show-error --output /tmp/readyz.json --write-out '%{http_code}' "$API_URL/readyz")" = "200"
          grep -q '"ok":true' /tmp/livez.json
          grep -q '"ok":true' /tmp/readyz.json
          test "$(curl --fail-with-body --silent --show-error --output /tmp/gateway.json --write-out '%{http_code}' "$GATEWAY_URL/health")" = "200"
          grep -q '"version":"4.2.0"' /tmp/gateway.json
          test "$(curl --fail-with-body --silent --show-error --output /tmp/setup.json --write-out '%{http_code}' "$SETUP_URL/health")" = "200"
          grep -q '"status":"ok"' /tmp/setup.json
          grep -q '"version":"4.2.0"' /tmp/setup.json
          grep -q '"route_setup"' /tmp/setup.json
          test "$(curl --fail-with-body --silent --show-error --output /tmp/intelligence.json --write-out '%{http_code}' "$INTELLIGENCE_URL/health")" = "200"
          grep -q '"status":"ok"' /tmp/intelligence.json
          grep -q '"version":"5.0.0"' /tmp/intelligence.json
          test "$(curl --fail-with-body --silent --show-error --output /tmp/purchases-live.json --write-out '%{http_code}' "$PURCHASES_URL/livez")" = "200"
          grep -q '"version":"5.3.0"' /tmp/purchases-live.json
          test "$(curl --fail-with-body --silent --show-error --output /tmp/purchases-ready.json --write-out '%{http_code}' "$PURCHASES_URL/readyz")" = "200"
          grep -q '"database":"ready"' /tmp/purchases-ready.json
          grep -q '"demand_inputs":"ready"' /tmp/purchases-ready.json
          test "$(curl --fail-with-body --silent --show-error --output /tmp/suppliers-live.json --write-out '%{http_code}' "$SUPPLIERS_URL/livez")" = "200"
          grep -q '"version":"5.2.0"' /tmp/suppliers-live.json
          test "$(curl --fail-with-body --silent --show-error --output /tmp/suppliers-ready.json --write-out '%{http_code}' "$SUPPLIERS_URL/readyz")" = "200"
          grep -q '"database":"ready"' /tmp/suppliers-ready.json
          echo 'public API readiness smoke ok'

      - name: Browser-origin CORS preflight
        run: |
          set -euo pipefail
          for target in "$GATEWAY_URL/cozinha360-delivery-v40/health" "$SETUP_URL/health" "$INTELLIGENCE_URL/health" "$PURCHASES_URL/livez" "$SUPPLIERS_URL/livez"; do
            headers="$(mktemp)"
            code="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' \
              -X OPTIONS "$target" \
              -H "Origin: $WEB_URL" \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization,content-type')"
            test "$code" = "204"
            grep -Eiq '^access-control-allow-origin: *(\*|https://cozinha-360-os-v41\.onrender\.com)' "$headers"
            grep -Eiq '^access-control-allow-headers:.*authorization' "$headers"
          done
          echo 'browser CORS smoke ok'

      - name: Tenant auth boundaries are closed
        run: |
          set -euo pipefail
          check_unauth() {
            local url="$1" file="$2"
            code="$(curl --silent --show-error --output "$file" --write-out '%{http_code}' "$url")"
            test "$code" = "401"
            grep -q 'Sessão inválida' "$file"
          }
          check_unauth "$INTELLIGENCE_URL/portfolio/overview" /tmp/intelligence-auth.json
          check_unauth "$PURCHASES_URL/businesses/1/purchase-plan?history_days=28&cover_days=7" /tmp/purchases-auth.json
          check_unauth "$SUPPLIERS_URL/businesses/1/suppliers" /tmp/suppliers-auth.json
          echo 'tenant auth boundaries ok'

      - name: Signup validation does not create a user
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            -X POST "$API_URL/auth/signup" \
            -H 'content-type: application/json' \
            --data '{"email":"not-an-email","password":"short"}')"
          test "$code" = "422"
          grep -q 'mínimo de 10 caracteres' "$body"
          echo 'signup validation smoke ok'

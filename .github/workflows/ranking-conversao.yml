name: Ranking Site Hostinger Build

on:
  push:
    branches:
      - convrank-hostinger-front
    paths:
      - 'ranking-conversao/**'
      - 'hostinger-deployer/**'
      - '.github/workflows/ranking-conversao.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
      HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
      HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      HOSTINGER_FTP_PATH: ${{ secrets.HOSTINGER_FTP_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ranking-conversao/package.json
      - name: Install
        working-directory: ranking-conversao
        run: npm install --no-audit --no-fund
      - name: Validate Hostinger deployer runtime syntax
        shell: bash
        run: |
          node --check hostinger-deployer/start.mjs
          node --check hostinger-deployer/deploy.mjs
          node --check hostinger-deployer/secrets.mjs
      - name: Build Hostinger /ranking-site bundle
        working-directory: ranking-conversao
        env:
          VITE_BASE_PATH: /ranking-site/
        run: npm run build
      - name: Stamp build provenance
        shell: bash
        run: |
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"source_sha":"%s","run_id":"%s","built_at":"%s","base_path":"/ranking-site/","application":"Global Conversion League","artifact":"hostinger-production-bundle"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$built_at" > ranking-conversao/dist/gcl-build.json
      - name: Validate production bundle
        id: validate
        shell: bash
        run: |
          set +e
          failures=0
          report=ranking-conversao/validation-report.txt
          : > "$report"
          gate() {
            name="$1"; shift
            if "$@"; then
              echo "PASS $name" | tee -a "$report"
            else
              echo "FAIL $name" | tee -a "$report"
              failures=$((failures+1))
            fi
          }
          forbid() {
            name="$1"; pattern="$2"
            if grep -R -q "$pattern" ranking-conversao/dist/assets; then
              echo "FAIL $name" | tee -a "$report"
              failures=$((failures+1))
            else
              echo "PASS $name" | tee -a "$report"
            fi
          }
          forbid_ci() {
            name="$1"; pattern="$2"
            if grep -R -i -q "$pattern" ranking-conversao/dist; then
              echo "FAIL $name" | tee -a "$report"
              failures=$((failures+1))
            else
              echo "PASS $name" | tee -a "$report"
            fi
          }
          gate index_exists test -f ranking-conversao/dist/index.html
          gate htaccess_exists test -f ranking-conversao/dist/.htaccess
          gate provenance_exists test -f ranking-conversao/dist/gcl-build.json
          gate provenance_sha grep -q "$GITHUB_SHA" ranking-conversao/dist/gcl-build.json
          gate provenance_application grep -q '"application":"Global Conversion League"' ranking-conversao/dist/gcl-build.json
          gate provenance_artifact grep -q '"artifact":"hostinger-production-bundle"' ranking-conversao/dist/gcl-build.json
          gate base_path grep -q '/ranking-site/' ranking-conversao/dist/index.html
          gate rewrite_base grep -q 'RewriteBase /ranking-site/' ranking-conversao/dist/.htaccess
          gate gcl_title grep -q 'Global Conversion League' ranking-conversao/dist/index.html
          gate world_cup_ranking grep -R -q 'A Copa do Mundo' ranking-conversao/dist/assets
          gate trophy_room grep -R -q 'SALA DE TROFÉUS' ranking-conversao/dist/assets
          gate qualifiers_open grep -R -q 'CLASSIFICATÓRIAS ABERTAS' ranking-conversao/dist/assets
          gate account_passport grep -R -q 'passaporte para a temporada GCL' ranking-conversao/dist/assets
          gate member_area_v25 grep -R -q 'Sua temporada em 5 movimentos' ranking-conversao/dist/assets
          gate member_recovery_mode grep -R -q 'MEMBER AREA · RECOVERY MODE' ranking-conversao/dist/assets
          gate member_retry_ui grep -R -q 'Tentar novamente' ranking-conversao/dist/assets
          gate auth_observer_idempotent grep -R -q 'ax24Patched' ranking-conversao/dist/assets
          gate community_progression grep -R -q 'PROGRESSÃO POR IMPACTO' ranking-conversao/dist/assets
          gate action_lab grep -R -q 'ACTION LAB' ranking-conversao/dist/assets
          gate notification_center grep -R -q 'GCL INBOX' ranking-conversao/dist/assets
          gate notification_high_value grep -R -q 'Hot Seats, Awards e movimentos relevantes do Ranking' ranking-conversao/dist/assets
          gate evidence_os grep -R -q 'GCL EVIDENCE OS' ranking-conversao/dist/assets
          gate market_request grep -R -q 'Solicitar diagnóstico de implementação' ranking-conversao/dist/assets
          forbid no_corpus_cohort_copy 'O corpus HTTP e o cohort'
          forbid no_percentile_lock_copy 'Percentis do corpus profundo permanecem bloqueados'
          forbid no_award_registry_copy 'Um selo que pode ser provado.'
          forbid no_old_awards_methodology 'Três sinais. Nenhum pay-to-win.'
          forbid no_benchmark_deepening_ui 'GCL INTELLIGENCE · BENCHMARK DEEPENING'
          forbid no_auth_characterdata_observer 'characterData:true'
          forbid_ci no_chatgpt_branding 'chatgpt'
          forbid_ci no_openai_branding 'openai'
          forbid_ci no_chatgpt_utm 'utm_source=chatgpt'
          forbid_ci no_render_preview_urls 'onrender.com'
          forbid_ci no_vercel_preview_urls 'vercel.app'
          forbid_ci no_netlify_preview_urls 'netlify.app'
          forbid_ci no_localhost_urls 'localhost:'
          if grep -R -q 'SUPABASE_SERVICE_ROLE_KEY' ranking-conversao/dist; then echo 'FAIL no_service_role_secret' | tee -a "$report"; failures=$((failures+1)); else echo 'PASS no_service_role_secret' | tee -a "$report"; fi
          if grep -R -q 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9' ranking-conversao/dist; then echo 'FAIL no_legacy_jwt' | tee -a "$report"; failures=$((failures+1)); else echo 'PASS no_legacy_jwt' | tee -a "$report"; fi
          echo "FAILURES $failures" | tee -a "$report"
          exit "$failures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranking-site-hostinger
          path: |
            ranking-conversao/dist
            ranking-conversao/validation-report.txt
          include-hidden-files: true
      - name: Publish Hostinger-ready branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: convrank-hostinger-dist
          publish_dir: ./ranking-conversao/dist
          force_orphan: true
          enable_jekyll: false
          commit_message: "deploy(gcl): ${{ github.sha }}"
      - name: Check Hostinger deployment credentials
        id: hostinger
        shell: bash
        run: |
          if [[ -n "$HOSTINGER_FTP_SERVER" && -n "$HOSTINGER_FTP_USERNAME" && -n "$HOSTINGER_FTP_PASSWORD" && -n "$HOSTINGER_FTP_PATH" ]]; then
            if [[ "$HOSTINGER_FTP_PATH" == "/" || "$HOSTINGER_FTP_PATH" == "." || "$HOSTINGER_FTP_PATH" != *"ranking-site"* ]]; then
              echo "Hostinger deploy credentials exist, but HOSTINGER_FTP_PATH is not safely scoped to ranking-site." >&2
              exit 1
            fi
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Hostinger FTPS deploy skipped: configure HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USERNAME, HOSTINGER_FTP_PASSWORD and HOSTINGER_FTP_PATH repository secrets."
          fi
      - name: Deploy validated bundle to Hostinger
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$HOSTINGER_FTP_USERNAME","$HOSTINGER_FTP_PASSWORD" "$HOSTINGER_FTP_SERVER" -e "set ssl:verify-certificate yes; set net:max-retries 2; set net:timeout 20; mirror -R --delete --parallel=4 ./ranking-conversao/dist/ '$HOSTINGER_FTP_PATH'; bye"
      - name: Verify Hostinger provenance
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 3 "https://plutyx.com/ranking-site/gcl-build.json?sha=$GITHUB_SHA")"
          echo "$body" | grep -q "$GITHUB_SHA"
          echo "Hostinger is serving the validated GCL build $GITHUB_SHA"

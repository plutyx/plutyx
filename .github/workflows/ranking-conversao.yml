name: Ranking Site Hostinger Build

on:
  push:
    branches:
      - convrank-hostinger-front
    paths:
      - 'ranking-conversao/**'
      - '.github/workflows/ranking-conversao.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ranking-conversao/package.json
      - name: Install
        working-directory: ranking-conversao
        run: npm install --no-audit --no-fund
      - name: Build Hostinger /ranking-site bundle
        working-directory: ranking-conversao
        env:
          VITE_BASE_PATH: /ranking-site/
        run: npm run build
      - name: Validate production bundle
        run: |
          test -f ranking-conversao/dist/index.html
          test -f ranking-conversao/dist/.htaccess
          grep -q '/ranking-site/' ranking-conversao/dist/index.html
          grep -q 'RewriteBase /ranking-site/' ranking-conversao/dist/.htaccess
          ! grep -R -q 'SUPABASE_SERVICE_ROLE_KEY' ranking-conversao/dist
          ! grep -R -q 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9' ranking-conversao/dist
      - uses: actions/upload-artifact@v4
        with:
          name: ranking-site-hostinger
          path: ranking-conversao/dist
          include-hidden-files: true

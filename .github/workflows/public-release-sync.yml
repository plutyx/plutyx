name: public-release-sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/public-release-sync.yml'

jobs:
  release-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      WEB_URL: https://cozinha-360-os-v41.onrender.com
      EXPECTED_RELEASE: '5.0.0'
    steps:
      - name: Wait for public frontend
        run: |
          for i in $(seq 1 55); do
            if curl --fail --silent --show-error --location "$WEB_URL/" -o /tmp/public-index.html; then
              marker="<meta name=\"c360-release\" content=\"$EXPECTED_RELEASE\""
              if grep -F "$marker" /tmp/public-index.html >/dev/null; then
                exit 0
              fi
            fi
            sleep 4
          done
          echo "::error title=Public frontend is stale::Expected Cozinha 360 release $EXPECTED_RELEASE on $WEB_URL."
          exit 1
      - name: Verify Vite production assets are referenced
        run: |
          grep -E '/assets/[^" ]+\.js' /tmp/public-index.html >/dev/null
      - name: Public release is synchronized
        run: echo "Public frontend matches release $EXPECTED_RELEASE on $WEB_URL."

name: container-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t cozinha360-api:test backend
      - name: Build frontend image
        run: docker build -t cozinha360-web:test frontend
